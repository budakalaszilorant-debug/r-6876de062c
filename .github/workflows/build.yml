# Mac nélküli ellenőrzés: a GitHub felhős gépein teszteli és lefordítja az iOS appot.
# Az iOS build aláírás nélkül, szimulátorra megy: csak azt mutatja meg, hogy a kód lefordul-e.
name: build
on:
  push:
  workflow_dispatch:

jobs:
  cloud-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: garage-ci-only
          POSTGRES_DB: garage_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Felhő jogosultságok és verzióütközések
        env:
          PGPASSWORD: garage-ci-only
        run: psql -h localhost -U postgres -d garage_test -f supabase/tests/cloud.sql
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Garázs adatbázis és mentés tesztek
        run: sh ios-app/Tests/Garage/run.sh
      - name: OBD dugó értelmező tesztek
        run: sh ios-app/Tests/Elm/run.sh
      - name: Nyilvános felhőbeállítások
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          python3 -m venv /tmp/garage-config
          /tmp/garage-config/bin/pip install PyYAML==6.0.2
          /tmp/garage-config/bin/python scripts/configure_cloud.py
      - name: Projekt generálás
        run: |
          brew install xcodegen
          cd ios-app && xcodegen generate
      - name: Fordítás (szimulátor, aláírás nélkül)
        run: |
          cd ios-app
          set -o pipefail
          xcodebuild build \
            -project SubaruCompanion.xcodeproj \
            -scheme SubaruCompanion \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: unused|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      # Szimulátoros app csomag: böngészős iPhone szimulátorba (pl. appetize.io) feltölthető.
      - name: Szimulátoros app csomagolása
        run: cd ios-app/build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/SubaruCompanion-simulator.zip" SubaruCompanion.app
      - uses: actions/upload-artifact@v4
        with:
          name: szimulator-app
          path: SubaruCompanion-simulator.zip
      # Telefonra telepíthető, aláíratlan csomag. Windowsról a Sideloadly írja alá a saját Apple ID-ddal.
      - name: Telefonos csomag (IPA) készítése
        run: |
          cd ios-app
          set -o pipefail
          xcodebuild build             -project SubaruCompanion.xcodeproj             -scheme SubaruCompanion             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath build-device             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             | tee device-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" device-build.log
          mkdir Payload
          cp -R build-device/Build/Products/Release-iphoneos/SubaruCompanion.app Payload/
          zip -qry "$GITHUB_WORKSPACE/SubaruCompanion.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: telefonra-ipa
          path: SubaruCompanion.ipa
      - name: Build napló feltöltése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-app/build.log
