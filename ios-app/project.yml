# Mac-en: brew install xcodegen && xcodegen generate  -> SubaruCompanion.xcodeproj
name: SubaruCompanion
options:
  bundleIdPrefix: hu.kocsi
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SUPABASE_URL: ""
    SUPABASE_PUBLISHABLE_KEY: ""
    # Google bejelentkezés (felhő mentés). A Google Cloud Console iOS OAuth kliens azonosítója;
    # üresen hagyva a felhő mentés ki van kapcsolva. A CI a GOOGLE_IOS_CLIENT_ID repo-változóból tölti.
    GOOGLE_CLIENT_ID: ""
    GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.not-configured"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: "2.26.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
targets:
  SubaruCompanion:
    type: application
    platform: iOS
    sources: [SubaruCompanion]
    dependencies:
      - target: SubaruWidget
      - package: GoogleSignIn
      - package: Supabase
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.kocsi.subaru
        CODE_SIGN_ENTITLEMENTS: SubaruCompanion/SubaruCompanion.entitlements
    info:
      path: SubaruCompanion/Info.plist
      properties:
        CFBundleDisplayName: Garázs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [bluetooth-central, location, fetch]
        NSSupportsLiveActivities: true
        # A mentések mappája látszik a Fájlok appban
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        BGTaskSchedulerPermittedIdentifiers: [hu.kocsi.subaru.servicecheck]
        NSBluetoothAlwaysUsageDescription: "Az app Bluetooth-on olvassa az autó adatait az OBD dugóról."
        NSLocationWhenInUseUsageDescription: "Az utak rögzítéséhez és a parkolási hely mentéséhez."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Az utak háttérben is rögzülnek, és a parkolási hely leállításkor mentődik."
        NSMotionUsageDescription: "A G-erő mérőhöz a telefon gyorsulásmérőjét használjuk."
        GIDClientID: $(GOOGLE_CLIENT_ID)
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [garazs]
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]

  # Kezdőképernyő / zárolási képernyő widget: feszültség + hűtővíz
  SubaruWidget:
    type: app-extension
    platform: iOS
    sources:
      - SubaruWidget
      - SubaruCompanion/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.kocsi.subaru.widget
        CODE_SIGN_ENTITLEMENTS: SubaruWidget/SubaruWidget.entitlements
    info:
      path: SubaruWidget/Info.plist
      properties:
        CFBundleDisplayName: Garázs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
